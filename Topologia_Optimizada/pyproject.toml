[project]
name = "topologia-optimizada"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "scikit-fem>=1.3.0",
    "cadquery>=2.3.0",
    "gmsh>=4.13.0",
    "PySide6>=6.6.0",
    "vtk>=9.2.0",
]

# The desktop CAD/CAE application is fully self-contained and does NOT require
# a web stack.  ``fastapi``, ``uvicorn``, ``pydantic`` and ``python-dotenv`` are
# used ONLY by the optional ``api_server.py`` web front-end, so they are kept in
# the optional ``web`` extra rather than as required runtime dependencies.
[project.optional-dependencies]
web = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]
topopt = [
    "topopt-python>=0.1.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.25.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[tool.setuptools]
py-modules = [
    "api_server",
    "geometry_processor",
]

[tool.pytest.ini_options]
# The self-contained application is independent of KratosMultiphysics and other
# external CAD solvers. ``experimentos/`` holds throwaway proof-of-concept
# scripts (including real Kratos experiments) and must be excluded from the
# test run. Legacy ``test_kratos_*.py`` modules at the root are marked live and
# skipped when KratosMultiphysics is unavailable.
norecursedirs = [
    "experimentos",
    ".*",
    "build",
    "dist",
    "node_modules",
    ".venv",
]
testpaths = ["."]
markers = [
    "kratos: requires KratosMultiphysics (legacy experiment; skipped in the self-contained build)",
    "slow: long-running validation tests that are skipped by default",
]
addopts = "-m 'not kratos'"
