<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entorno de Optimización Topológica</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <style>
    :root { color-scheme: light; --bg:#f5f7fa; --card:#fff; --ink:#172033; --muted:#667085; --line:#d9e0e8; --blue:#1769e0; --green:#147d50; --red:#b42318; --input-bg:#f0f2f5; --panel-bg:#ffffff; }
    * { box-sizing:border-box; } body { margin:0; background:var(--bg); color:var(--ink); font:14px system-ui,sans-serif; height:100vh; overflow:hidden; }
    
    .layout { display:grid; grid-template-columns: 320px 1fr; grid-template-rows: 60px 1fr; height:100vh; }
    
    .header { grid-column:1/-1; background:var(--panel-bg); border-bottom:1px solid var(--line); display:flex; align-items:center; padding:0 20px; justify-content:space-between; }
    .header h1 { margin:0; font-size:18px; }
    
    .sidebar { background:var(--panel-bg); border-right:1px solid var(--line); overflow-y:auto; padding:20px; }
    .viewer { position:relative; background:#1a1a1a; overflow:hidden; }
    
    .panel { margin-bottom:24px; }
    .panel h3 { margin:0 0 12px; font-size:15px; font-weight:600; color:var(--ink); }
    
    .form-group { margin-bottom:16px; }
    .form-group label { display:block; margin-bottom:6px; font-weight:500; font-size:13px; color:var(--ink); }
    .form-group input, .form-group select { width:100%; padding:8px; border:1px solid var(--line); border-radius:6px; background:var(--input-bg); font:inherit; font-size:13px; }
    .form-group input:focus, .form-group select:focus { outline:2px solid var(--blue); border-color:var(--blue); }
    
    .btn { width:100%; padding:10px; border:1px solid var(--line); border-radius:6px; background:#fff; color:#154b9b; font:inherit; font-weight:600; cursor:pointer; font-size:13px; }
    .btn.primary { background:var(--blue); border-color:var(--blue); color:#fff; }
    .btn:disabled { opacity:.5; cursor:not-allowed; }
    
    .viewer-controls { position:absolute; top:10px; right:10px; display:flex; gap:8px; z-index:10; }
    .viewer-controls button { padding:8px 12px; background:rgba(255,255,255,0.9); border:1px solid var(--line); border-radius:4px; cursor:pointer; font-size:12px; }
    
    .status-bar { position:absolute; bottom:0; left:0; right:0; background:rgba(0,0,0,0.8); color:#fff; padding:8px 16px; font-size:12px; display:flex; justify-content:space-between; align-items:center; }
    
    .legend { display:flex; gap:16px; font-size:12px; }
    .legend-item { display:flex; align-items:center; gap:6px; }
    .legend-color { width:12px; height:12px; border-radius:2px; }
    
    .info-text { font-size:12px; color:var(--muted); margin-top:4px; }
    
    .hidden { display:none; }
    
    #loading-overlay { position:absolute; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.7); display:flex; align-items:center; justify-content:center; color:#fff; z-index:100; }
  </style>
</head>
<body>
<div class="layout">
  <header class="header">
    <h1>Entorno de Optimización Topológica</h1>
    <div>
      <span id="connection-status" class="info-text">● Conectado a Onshape</span>
      <button id="back-btn" class="btn" style="width:auto; margin-left:16px;">← Volver al Selector</button>
    </div>
  </header>
  
  <aside class="sidebar">
    <div class="panel">
      <h3>📊 Estado</h3>
      <div id="app-status" class="info-text">Listo para configurar optimización</div>
    </div>
    
    <div class="panel">
      <h3>�️ Visibilidad</h3>
      <div class="form-group">
        <label>
          <input type="checkbox" id="show-geometry" checked> Geometría Principal
        </label>
      </div>
      <div class="form-group">
        <label>
          <input type="checkbox" id="show-keepout" checked> Keep-out / Obstáculos
        </label>
      </div>
      <div class="form-group">
        <label>
          <input type="checkbox" id="show-forces-viz" checked> Fuerzas
        </label>
      </div>
      <div class="form-group">
        <label>
          <input type="checkbox" id="show-constraints-viz" checked> Restricciones
        </label>
      </div>
    </div>
    
    <div class="panel">
      <h3>�🔧 Cargas</h3>
      <div class="form-group">
        <label for="force-magnitude">Magnitud (N)</label>
        <input type="number" id="force-magnitude" value="100" min="0" step="1">
      </div>
      <div class="form-group">
        <label for="force-direction-x">Dirección X</label>
        <input type="number" id="force-direction-x" value="0" step="0.1">
      </div>
      <div class="form-group">
        <label for="force-direction-y">Dirección Y</label>
        <input type="number" id="force-direction-y" value="0" step="0.1">
      </div>
      <div class="form-group">
        <label for="force-direction-z">Dirección Z</label>
        <input type="number" id="force-direction-z" value="-1" step="0.1">
      </div>
      <button id="add-force" class="btn">+ Agregar Fuerza</button>
    </div>
    
    <div class="panel">
      <h3>🔒 Restricciones</h3>
      <div class="form-group">
        <label>Tipo de fijación</label>
        <select id="constraint-type">
          <option value="fixed">Fija (todos los grados)</option>
          <option value="pinned">Pinnada (rotación libre)</option>
          <option value="roller">Rodillo (un eje libre)</option>
        </select>
      </div>
      <button id="add-constraint" class="btn">+ Agregar Restricción</button>
    </div>
    
    <div class="panel">
      <h3>⚙️ Optimización</h3>
      <div class="form-group">
        <label for="volume-fraction">Fracción de volumen</label>
        <input type="range" id="volume-fraction" min="0.1" max="0.9" step="0.05" value="0.5">
        <div class="info-text"><span id="volume-value">50%</span> reducción objetivo</div>
      </div>
      <div class="form-group">
        <label for="max-iterations">Iteraciones máximas</label>
        <input type="number" id="max-iterations" value="100" min="10" max="1000" step="10">
      </div>
      <button id="run-preview" class="btn">🔄 Previsualizar</button>
      <button id="run-optimization" class="btn primary">▶ Ejecutar Optimización</button>
    </div>
    
    <div class="panel">
      <h3>📐 Material</h3>
      <div class="form-group">
        <label for="material">Material</label>
        <select id="material">
          <option value="steel">Acero (E=200 GPa, ν=0.3)</option>
          <option value="aluminum">Aluminio (E=70 GPa, ν=0.33)</option>
          <option value="titanium">Titanio (E=110 GPa, ν=0.34)</option>
        </select>
      </div>
    </div>
  </aside>
  
  <main class="viewer" id="viewer-container">
    <div class="viewer-controls">
      <button id="reset-camera">📷 Reset Cámara</button>
      <button id="toggle-wireframe">🔲 Wireframe</button>
      <button id="toggle-axes">📐 Ejes</button>
      <button id="toggle-forces">⚡ Fuerzas</button>
      <button id="toggle-constraints">🔒 Restricciones</button>
      <button id="view-original">📦 Original</button>
      <button id="view-optimized">🎯 Optimizado</button>
    </div>
    
    <div class="status-bar">
      <div class="legend">
        <div class="legend-item"><div class="legend-color" style="background:#4a90e2;"></div>Design Space</div>
        <div class="legend-item"><div class="legend-color" style="background:#e74c3c;"></div>Keep-out</div>
        <div class="legend-item"><div class="legend-color" style="background:#2ecc71;"></div>Optimizado</div>
        <div class="legend-item"><div class="legend-color" style="background:#f39c12;"></div>Fuerzas</div>
        <div class="legend-item"><div class="legend-color" style="background:#9b59b6;"></div>Restricciones</div>
      </div>
      <div id="viewer-info">Visor 3D listo</div>
    </div>
    
    <div id="loading-overlay" class="hidden">
      <div id="loading-text">Cargando geometría...</div>
    </div>
  </main>
</div>

<script>
  // Variables globales
  let scene, camera, renderer, controls;
  let geometryMesh = null;
  let keepOutMeshes = []; // Array para geometrías keep-out
  let forces = [];
  let constraints = [];
  let forceVectors = []; // Array para almacenar visualizaciones de fuerzas
  let constraintVisuals = []; // Array para almacenar visualizaciones de restricciones
  let isWireframe = false;
  let showAxes = false;
  let axesHelper = null;
  let visibilityState = {
    geometry: true,
    keepOut: true,
    forces: true,
    constraints: true
  };
  
  const $ = id => document.getElementById(id);
  
  // Inicializar visor 3D
  function initViewer() {
    const container = $('viewer-container');
    const width = container.clientWidth;
    const height = container.clientHeight;
    
    // Escena
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a1a);
    
    // Cámara
    camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
    camera.position.set(5, 5, 5);
    
    // Renderer
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(width, height);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);
    
    // Controles de órbita
    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    
    // Luces
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambientLight);
    
    const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
    directionalLight.position.set(10, 10, 10);
    scene.add(directionalLight);
    
    const directionalLight2 = new THREE.DirectionalLight(0xffffff, 0.4);
    directionalLight2.position.set(-10, -10, -10);
    scene.add(directionalLight2);
    
    // Grid helper
    const gridHelper = new THREE.GridHelper(10, 10, 0x444444, 0x333333);
    scene.add(gridHelper);
    
    // Event listeners
    window.addEventListener('resize', onWindowResize);
    
    // Animación
    animate();
    
    $('viewer-info').textContent = 'Visor 3D inicializado';
  }
  
  function onWindowResize() {
    const container = $('viewer-container');
    const width = container.clientWidth;
    const height = container.clientHeight;
    
    camera.aspect = width / height;
    camera.updateProjectionMatrix();
    renderer.setSize(width, height);
  }
  
  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }
  
  // Cargar geometría de ejemplo (cubo)
  function loadSampleGeometry() {
    const geometry = new THREE.BoxGeometry(2, 2, 2);
    const material = new THREE.MeshPhongMaterial({ 
      color: 0x4a90e2,
      wireframe: isWireframe
    });
    
    geometryMesh = new THREE.Mesh(geometry, material);
    scene.add(geometryMesh);
    
    $('viewer-info').textContent = 'Geometría de ejemplo cargada';
  }
  
  // Crear vector de fuerza (flecha 3D)
  function createForceVector(origin, direction, magnitude, color = 0xf39c12) {
    // Normalizar dirección
    const dir = new THREE.Vector3(direction.x, direction.y, direction.z);
    if (dir.length() > 0) {
      dir.normalize();
    }
    
    // Calcular longitud basada en magnitud (escala visual)
    const length = Math.min(magnitude / 50, 2); // Escala visual reasonable
    
    // Crear flecha
    const arrowHelper = new THREE.ArrowHelper(
      dir,
      origin,
      length,
      color,
      length * 0.2, // longitud de la cabeza
      length * 0.1  // ancho de la cabeza
    );
    
    return arrowHelper;
  }
  
  // Visualizar fuerzas en el visor 3D
  function visualizeForces() {
    // Limpiar visualizaciones anteriores
    forceVectors.forEach(vector => scene.remove(vector));
    forceVectors = [];
    
    // Agregar nuevas visualizaciones
    forces.forEach((force, index) => {
      const origin = new THREE.Vector3(0, 1, 0); // Punto de aplicación (ejemplo: cara superior)
      const direction = {
        x: force.direction_x,
        y: force.direction_y,
        z: force.direction_z
      };
      
      const forceVector = createForceVector(origin, direction, force.magnitude);
      scene.add(forceVector);
      forceVectors.push(forceVector);
    });
    
    $('viewer-info').textContent = `${forces.length} fuerza(s) visualizada(s)`;
  }
  
  // Crear visualización de restricción (cubo esquemático)
  function createConstraintVisualization(location, constraintType, color = 0x9b59b6) {
    const size = 0.3;
    const geometry = new THREE.BoxGeometry(size, size, size);
    const material = new THREE.MeshPhongMaterial({ 
      color: color,
      wireframe: true,
      transparent: true,
      opacity: 0.7
    });
    
    const constraintMesh = new THREE.Mesh(geometry, material);
    constraintMesh.position.copy(location);
    
    // Agregar indicador visual según tipo
    let indicator;
    if (constraintType === 'fixed') {
      // Cubo sólido para fijación completa
      const solidGeometry = new THREE.BoxGeometry(size * 0.6, size * 0.6, size * 0.6);
      const solidMaterial = new THREE.MeshPhongMaterial({ color: color, opacity: 0.5, transparent: true });
      indicator = new THREE.Mesh(solidGeometry, solidMaterial);
    } else if (constraintType === 'pinned') {
      // Esfera para pinnada
      const sphereGeometry = new THREE.SphereGeometry(size * 0.4, 16, 16);
      const sphereMaterial = new THREE.MeshPhongMaterial({ color: color, opacity: 0.5, transparent: true });
      indicator = new THREE.Mesh(sphereGeometry, sphereMaterial);
    } else if (constraintType === 'roller') {
      // Cilindro para rodillo
      const cylinderGeometry = new THREE.CylinderGeometry(size * 0.2, size * 0.2, size * 0.8, 16);
      const cylinderMaterial = new THREE.MeshPhongMaterial({ color: color, opacity: 0.5, transparent: true });
      indicator = new THREE.Mesh(cylinderGeometry, cylinderMaterial);
    }
    
    if (indicator) {
      indicator.position.copy(location);
      constraintMesh.add(indicator);
    }
    
    return constraintMesh;
  }
  
  // Visualizar restricciones en el visor 3D
  function visualizeConstraints() {
    // Limpiar visualizaciones anteriores
    constraintVisuals.forEach(constraint => scene.remove(constraint));
    constraintVisuals = [];
    
    // Agregar nuevas visualizaciones
    constraints.forEach((constraint, index) => {
      // Para ejemplo, usar ubicaciones fijas en el cubo
      const locations = [
        new THREE.Vector3(-1, -1, -1), // esquina inferior izquierda
        new THREE.Vector3(1, -1, -1),  // esquina inferior derecha
        new THREE.Vector3(0, -1, 0),   // centro inferior
        new THREE.Vector3(-1, 1, -1)   // esquina superior izquierda
      ];
      
      const location = locations[index % locations.length];
      const constraintVisual = createConstraintVisualization(location, constraint.constraint_type);
      scene.add(constraintVisual);
      constraintVisuals.push(constraintVisual);
    });
    
    $('viewer-info').textContent = `${constraints.length} restricción(es) visualizada(s)`;
  }
  
  // Actualizar visualización completa
  function updateVisualization() {
    visualizeForces();
    visualizeConstraints();
  }
  
  // Controles del visor
  $('reset-camera').addEventListener('click', () => {
    camera.position.set(5, 5, 5);
    camera.lookAt(0, 0, 0);
    controls.reset();
  });
  
  $('toggle-wireframe').addEventListener('click', () => {
    isWireframe = !isWireframe;
    if (geometryMesh) {
      geometryMesh.material.wireframe = isWireframe;
    }
  });
  
  $('toggle-axes').addEventListener('click', () => {
    showAxes = !showAxes;
    if (showAxes) {
      if (!axesHelper) {
        axesHelper = new THREE.AxesHelper(3);
        scene.add(axesHelper);
      }
    } else {
      if (axesHelper) {
        scene.remove(axesHelper);
      }
    }
  });
  
  // Toggle visualización de fuerzas
  let showForces = true;
  $('toggle-forces').addEventListener('click', () => {
    showForces = !showForces;
    forceVectors.forEach(vector => {
      vector.visible = showForces;
    });
    $('viewer-info').textContent = showForces ? 'Fuerzas visibles' : 'Fuerzas ocultas';
  });
  
  // Toggle visualización de restricciones
  let showConstraints = true;
  $('toggle-constraints').addEventListener('click', () => {
    showConstraints = !showConstraints;
    constraintVisuals.forEach(constraint => {
      constraint.visible = showConstraints;
    });
    $('viewer-info').textContent = showConstraints ? 'Restricciones visibles' : 'Restricciones ocultas';
  });
  
  // Vista original
  $('view-original').addEventListener('click', () => {
    if (geometryMesh) {
      geometryMesh.material.color.setHex(0x4a90e2); // Azul para original
      geometryMesh.material.opacity = 1.0;
      geometryMesh.material.transparent = false;
    }
    $('viewer-info').textContent = 'Vista: Geometría Original';
  });
  
  // Vista optimizada (simulada)
  $('view-optimized').addEventListener('click', () => {
    if (geometryMesh) {
      geometryMesh.material.color.setHex(0x2ecc71); // Verde para optimizado
      geometryMesh.material.opacity = 0.8;
      geometryMesh.material.transparent = true;
    }
    $('viewer-info').textContent = 'Vista: Geometría Optimizada (simulada)';
  });
  
  // Controles de visibilidad
  $('show-geometry').addEventListener('change', (e) => {
    visibilityState.geometry = e.target.checked;
    if (geometryMesh) {
      geometryMesh.visible = visibilityState.geometry;
    }
    $('viewer-info').textContent = visibilityState.geometry ? 'Geometría visible' : 'Geometría oculta';
  });
  
  $('show-keepout').addEventListener('change', (e) => {
    visibilityState.keepOut = e.target.checked;
    keepOutMeshes.forEach(mesh => {
      mesh.visible = visibilityState.keepOut;
    });
    $('viewer-info').textContent = visibilityState.keepOut ? 'Keep-out visible' : 'Keep-out oculto';
  });
  
  $('show-forces-viz').addEventListener('change', (e) => {
    visibilityState.forces = e.target.checked;
    forceVectors.forEach(vector => {
      vector.visible = visibilityState.forces;
    });
    $('viewer-info').textContent = visibilityState.forces ? 'Fuerzas visibles' : 'Fuerzas ocultas';
  });
  
  $('show-constraints-viz').addEventListener('change', (e) => {
    visibilityState.constraints = e.target.checked;
    constraintVisuals.forEach(constraint => {
      constraint.visible = visibilityState.constraints;
    });
    $('viewer-info').textContent = visibilityState.constraints ? 'Restricciones visibles' : 'Restricciones ocultas';
  });
  
  // Función para agregar geometría keep-out (ejemplo)
  function addKeepOutGeometry() {
    // Crear un cubo más pequeño como ejemplo de keep-out
    const keepOutGeometry = new THREE.BoxGeometry(0.5, 0.5, 0.5);
    const keepOutMaterial = new THREE.MeshPhongMaterial({ 
      color: 0xe74c3c, // Rojo para keep-out
      wireframe: true,
      transparent: true,
      opacity: 0.5
    });
    
    const keepOutMesh = new THREE.Mesh(keepOutGeometry, keepOutMaterial);
    keepOutMesh.position.set(0.5, 0.5, 0.5); // Posición de ejemplo
    scene.add(keepOutMesh);
    keepOutMeshes.push(keepOutMesh);
  }
  
  // Actualizar valor de fracción de volumen
  $('volume-fraction').addEventListener('input', (e) => {
    const value = Math.round(e.target.value * 100);
    $('volume-value').textContent = value + '%';
  });
  
  // Botón de volver
  $('back-btn').addEventListener('click', () => {
    window.location.href = '/';
  });
  
  // Funcionalidad de fuerzas
  let forces = [];
  
  $('add-force').addEventListener('click', async () => {
    const magnitude = parseFloat($('force-magnitude').value);
    const dirX = parseFloat($('force-direction-x').value);
    const dirY = parseFloat($('force-direction-y').value);
    const dirZ = parseFloat($('force-direction-z').value);
    
    if (magnitude <= 0) {
      $('app-status').textContent = 'La magnitud debe ser mayor a 0';
      return;
    }
    
    if (dirX === 0 && dirY === 0 && dirZ === 0) {
      $('app-status').textContent = 'La dirección no puede ser (0, 0, 0)';
      return;
    }
    
    const force = {
      magnitude: magnitude,
      direction_x: dirX,
      direction_y: dirY,
      direction_z: dirZ,
      force_type: 'point'
    };
    
    forces.push(force);
    
    try {
      const response = await fetch('/api/boundary/forces', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify(forces)
      });
      
      if (!response.ok) throw new Error('Error al guardar fuerzas');
      
      const result = await response.json();
      $('app-status').textContent = result.message;
      
      // Actualizar visualización en el visor 3D
      updateVisualization();
      
    } catch (error) {
      $('app-status').textContent = 'Error: ' + error.message;
    }
  });
  
  // Funcionalidad de restricciones
  let constraints = [];
  
  $('add-constraint').addEventListener('click', async () => {
    const constraintType = $('constraint-type').value;
    
    const constraint = {
      constraint_type: constraintType,
      location: 'manual',
      degrees_of_freedom: {
        ux: true, uy: true, uz: true,
        rx: constraintType !== 'pinned',
        ry: constraintType !== 'pinned',
        rz: constraintType !== 'pinned'
      }
    };
    
    constraints.push(constraint);
    
    try {
      const response = await fetch('/api/boundary/constraints', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify(constraints)
      });
      
      if (!response.ok) throw new Error('Error al guardar restricciones');
      
      const result = await response.json();
      $('app-status').textContent = result.message;
      
      // Actualizar visualización en el visor 3D
      updateVisualization();
      
    } catch (error) {
      $('app-status').textContent = 'Error: ' + error.message;
    }
  });
  
  $('run-preview').addEventListener('click', async () => {
    $('app-status').textContent = 'Previsualización pendiente de implementación - requiere mesher real';
  });
  
  $('run-optimization').addEventListener('click', async () => {
    const volumeFraction = parseFloat($('volume-fraction').value);
    const maxIterations = parseInt($('max-iterations').value);
    
    try {
      $('app-status').textContent = 'Iniciando optimización...';
      
      const response = await fetch('/api/topopt/run', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({
          volume_fraction: volumeFraction,
          max_iterations: maxIterations,
          tolerance: 0.01,
          penalization: 3.0,
          rmin: 1.5,
          forces: forces,
          constraints: constraints
        })
      });
      
      if (!response.ok) throw new Error('Error al ejecutar optimización');
      
      const result = await response.json();
      
      if (result.status === 'pending') {
        $('app-status').textContent = result.message + ' - ' + result.details;
      } else if (result.status === 'success') {
        $('app-status').textContent = '✓ ' + result.message;
      } else {
        $('app-status').textContent = '✗ ' + result.message;
      }
      
    } catch (error) {
      $('app-status').textContent = 'Error: ' + error.message;
    }
  });
  
  // Inicializar
  initViewer();
  loadSampleGeometry();
  addKeepOutGeometry(); // Agregar geometría keep-out de ejemplo
</script>
