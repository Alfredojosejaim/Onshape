[project]
name = "topologia-optimizada"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "cadquery>=2.3.0",
    "gmsh>=4.13.0",
    "PySide6>=6.6.0",
    "vtk>=9.2.0",
]

# The desktop CAD/CAE application is fully self-contained and does NOT require
# a web stack.  The former FastAPI web front-end (api_server.py) was removed.
#
# The FEA engine is Kratos Multiphysics, bundled self-contained in the venv via
# `requirements.txt` (wheels published on PyPI for CPython 3.11 / win_amd64).
# `kratos` extra documents the same pinned set for pip-based installs.
[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]
kratos = [
    "KratosMultiphysics==10.4.3",
    "KratosStructuralMechanicsApplication==10.4.3",
    "KratosOptimizationApplication==10.4.3",
]

[tool.pytest.ini_options]
# KratosMultiphysics is bundled with the app (see requirements.txt), so the
# FEA path (and `kratos`-marked tests) normally run. The `kratos` marker is
# still available for environments where it cannot be installed.
norecursedirs = [
    ".*",
    "build",
    "dist",
    "node_modules",
    ".venv",
]
testpaths = ["."]
markers = [
    "kratos: requires KratosMultiphysics (bundled; skipped only when unavailable)",
    "slow: long-running validation tests that are skipped by default",
]
addopts = "-m 'not slow'"
