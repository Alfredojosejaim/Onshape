<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Topología optimizada</title>
  <style>
    :root { color-scheme: light; --bg:#f5f7fa; --card:#fff; --ink:#172033; --muted:#667085; --line:#d9e0e8; --blue:#1769e0; --green:#147d50; --red:#b42318; }
    * { box-sizing:border-box; } body { margin:0; background:var(--bg); color:var(--ink); font:14px system-ui,sans-serif; }
    main { width:min(460px,100%); margin:auto; padding:24px 16px; } .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; box-shadow:0 4px 14px #1720330d; }
    h1 { margin:0 0 18px; font-size:22px; } h2 { margin:0 0 16px; font-size:16px; } .row { display:flex; justify-content:space-between; gap:12px; padding:10px 0; border-top:1px solid var(--line); }
    .label { color:var(--muted); } .value { font-weight:650; text-align:right; } .connected { color:var(--green); } .disconnected { color:var(--red); } .actions { display:flex; gap:8px; margin-top:18px; }
    button { flex:1; min-height:38px; border:1px solid var(--line); border-radius:7px; background:#fff; color:#154b9b; font:inherit; font-weight:650; cursor:pointer; } button.primary { background:var(--blue); border-color:var(--blue); color:#fff; } button:disabled { opacity:.5; cursor:not-allowed; }
    #notice { margin-top:14px; padding:10px; border-radius:7px; background:#eef2f7; color:var(--muted); } #notice.error { background:#fff0ee; color:var(--red); } .hidden { display:none; }
  </style>
</head>
<body>
<main>
  <section class="card">
    <h1>Topología optimizada</h1>
    <h2>Estado de la aplicación</h2>
    <div class="row"><span class="label">Aplicación</span><span id="app-status" class="value connected">● Aplicación iniciada</span></div>
    <div class="row"><span class="label">Onshape</span><span id="onshape-status" class="value disconnected">○ No conectado</span></div>
    <div class="row"><span class="label">Usuario</span><span id="user" class="value">No autenticado</span></div>
    <div class="actions"><button id="login" class="primary" type="button">Conectar con Onshape</button><button id="logout" class="hidden" type="button">Desconectar</button></div>
    <div id="notice" class="hidden" role="status" aria-live="polite"></div>
  </section>
</main>
<script>
  const $ = id => document.getElementById(id);
  function showError(message) { $('notice').textContent = message; $('notice').className = 'error'; $('notice').classList.remove('hidden'); }
  function setConnection(data) {
    const connected = Boolean(data.authenticated);
    $('onshape-status').textContent = connected ? '● Conectado' : '○ No conectado';
    $('onshape-status').className = `value ${connected ? 'connected' : 'disconnected'}`;
    $('user').textContent = connected ? (data.user?.name || data.user?.email || 'Usuario autenticado') : 'No autenticado';
    $('login').classList.toggle('hidden', connected); $('logout').classList.toggle('hidden', !connected);
  }
  async function refresh() {
    const response = await fetch('/api/auth/status', { credentials:'include' }); const data = await response.json();
    if (!response.ok) throw new Error('No se pudo consultar la conexión con Onshape.'); setConnection(data);
  }
  $('login').addEventListener('click', () => { window.location.href = '/login'; });
  $('logout').addEventListener('click', async () => { const response = await fetch('/api/auth/logout', { method:'POST', credentials:'include' }); if (!response.ok) throw new Error('No se pudo cerrar la sesión.'); setConnection({ authenticated:false }); });
  refresh().catch(error => showError(error.message));
</script>
</body>
</html>
