<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background App Rounded Square -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="url(#bgGrad)" stroke="#334155" stroke-width="4" filter="url(#shadow)" />

  <!-- Desktop App Window Frame -->
  <rect x="64" y="76" width="384" height="276" rx="20" fill="#1e293b" stroke="#475569" stroke-width="3" />
  
  <!-- Window Header Bar -->
  <rect x="64" y="76" width="384" height="44" rx="20" fill="#0f172a" />
  <rect x="64" y="100" width="384" height="20" fill="#0f172a" />
  
  <!-- Window Traffic Lights -->
  <circle cx="94" cy="98" r="7" fill="#ef4444" />
  <circle cx="116" cy="98" r="7" fill="#f59e0b" />
  <circle cx="138" cy="98" r="7" fill="#10b981" />
  
  <!-- Split Screen Divider inside Window -->
  <line x1="256" y1="120" x2="256" y2="352" stroke="#334155" stroke-width="2" stroke-dasharray="4 4" />

  <!-- Left Side: Code Symbols (TSX / HTML) -->
  <path d="M 140 180 L 105 220 L 140 260" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 200 180 L 235 220 L 200 260" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="180" y1="165" x2="160" y2="275" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" />

  <!-- Right Side: Live Frontend Preview Eye / Screen -->
  <rect x="286" y="152" width="132" height="96" rx="10" fill="#0f172a" stroke="#2563eb" stroke-width="3" />
  <circle cx="352" cy="200" r="22" fill="none" stroke="#34d399" stroke-width="6" />
  <circle cx="352" cy="200" r="10" fill="#38bdf8" />
  <rect x="298" y="262" width="48" height="12" rx="6" fill="#3b82f6" />
  <rect x="354" y="262" width="54" height="12" rx="6" fill="#64748b" />

  <!-- Bottom Stand / Pedestal for Desktop feeling -->
  <path d="M 216 352 L 296 352 L 312 400 L 200 400 Z" fill="#334155" />
  <rect x="160" y="400" width="192" height="16" rx="8" fill="#475569" />

  <!-- Floating Badge: Live TSX/HTML Engine -->
  <g transform="translate(196, 428)">
    <rect x="-10" y="-8" width="140" height="28" rx="14" fill="#0284c7" />
    <text x="60" y="11" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12" text-anchor="middle" letter-spacing="1.5">STANDALONE</text>
  </g>
</svg>
