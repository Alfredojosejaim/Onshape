[project]
name = "topologia-optimizada"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "cadquery>=2.3.0",
    "gmsh>=4.13.0",
    "PySide6>=6.6.0",
    "vtk>=9.2.0",
]

# The desktop CAD/CAE application is fully self-contained and does NOT require
# a web stack.  The former FastAPI web front-end (api_server.py) was removed.
[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[tool.pytest.ini_options]
# The self-contained application is independent of KratosMultiphysics and other
# external CAD solvers. Tests that require KratosMultiphysics are marked ``kratos``
# and skipped when it is unavailable.
norecursedirs = [
    ".*",
    "build",
    "dist",
    "node_modules",
    ".venv",
]
testpaths = ["."]
markers = [
    "kratos: requires KratosMultiphysics (optional; skipped when unavailable)",
    "slow: long-running validation tests that are skipped by default",
]
addopts = "-m 'not kratos'"
